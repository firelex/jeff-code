[project]
name = "jeff-first-tools"
version = "0.1.0"
description = "Tools for the JeffFirst phase-0 shadow run: coverage report, Spark gate server, Harbor agent"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.12.15",
    "harbor==0.23.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# tests_jeff_dev needs jeff-dev's Python and a checkpoint; it is run on its own (see its docstring).
testpaths = ["tests"]
